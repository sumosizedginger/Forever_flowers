html, body {

  right: calc(env(safe-area-inset-right, 0px) + var(--btn-margin));

#ui.on { opacity: var(--btn-opacity); visibility: visible; pointer-events: auto; transition: opacity var(--btn-fade) ease, visibility 0s; }
#ui.on.dim { opacity: var(--btn-dim-opacity); }
#ui button {
  width: var(--btn-size); height: var(--btn-size); margin: 0; padding: 0;
  border-radius: 50%; border: 1px solid var(--btn-line);
  background: var(--btn-bg); color: var(--btn-ink);
  display: grid; place-items: center; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
#ui button svg { width: var(--btn-icon); height: var(--btn-icon); display: block; }
#ui button:focus { outline: none; }
#ui button:focus-visible { outline: 2px solid var(--btn-focus); outline-offset: 3px; }
#snd .on { display: none; }
#snd[aria-pressed="true"] .on { display: inline; }
#snd[aria-pressed="true"] .off { display: none; }
